<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lista de precios</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f1f1f1;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .contenedor {
      width: 100%;
      max-width: 450px;

      background: white;

      padding: 30px 25px;

      border-radius: 18px;

      box-shadow: 0 5px 25px rgba(0,0,0,0.12);

      text-align: center;
    }

    h1 {
      margin: 0 0 10px 0;
    }

    .descripcion {
      color: #666;
      margin-bottom: 25px;
    }

    input {
      width: 100%;

      padding: 15px;

      font-size: 18px;

      border: 1px solid #ccc;

      border-radius: 10px;

      text-align: center;

      outline: none;
    }

    input:focus {
      border-color: #222;
    }

    button {
      width: 100%;

      margin-top: 15px;

      padding: 15px;

      font-size: 18px;

      font-weight: bold;

      border: none;

      border-radius: 10px;

      background: #222;

      color: white;

      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    #resultado {
      margin-top: 25px;
    }

    .producto {
      background: #f5f5f5;

      padding: 20px;

      border-radius: 12px;
    }

    .nombre {
      font-size: 22px;

      font-weight: bold;

      margin-bottom: 12px;
    }

    .precio {
      font-size: 30px;

      font-weight: bold;
    }

    .mensaje {
      padding: 15px;

      border-radius: 10px;

      background: #fff3cd;

      color: #664d03;
    }

    .error {
      background: #f8d7da;

      color: #842029;
    }

    .cargando {
      color: #666;

      font-size: 16px;
    }
  </style>
</head>


<body>

  <div class="contenedor">

    <h1>Consulta de precios</h1>

    <div class="descripcion">
      Ingresá el código del producto
    </div>


    <input
      type="text"
      id="codigo"
      placeholder="Ejemplo: 00125"
      autocomplete="off"
    >


    <button id="botonBuscar">
      BUSCAR
    </button>


    <div id="resultado"></div>

  </div>


  <script>

    // URL DE TU GOOGLE APPS SCRIPT

    const API_URL =
      "https://script.google.com/macros/s/AKfycbyUh7fvXzP0EXYxyBQHUN3CA1flwlrI7tLZ6-CVddvtAtho9iMppSRyIbsaTBbww2iM/exec";


    // Elementos de la página

    const campoCodigo =
      document.getElementById("codigo");

    const botonBuscar =
      document.getElementById("botonBuscar");

    const resultado =
      document.getElementById("resultado");


    // Cuando se toca BUSCAR

    botonBuscar.addEventListener("click", buscarProducto);


    // También permite buscar presionando ENTER

    campoCodigo.addEventListener("keydown", function(event) {

      if (event.key === "Enter") {

        buscarProducto();

      }

    });


    async function buscarProducto() {

      const codigo =
        campoCodigo.value.trim();


      // Si no escribió nada

      if (codigo === "") {

        resultado.innerHTML = `
          <div class="mensaje">
            Ingresá un código.
          </div>
        `;

        return;
      }


      // Mostrar que está buscando

      resultado.innerHTML = `
        <div class="cargando">
          Buscando producto...
        </div>
      `;


      try {

        // Crear dirección de consulta

        const url =
          API_URL +
          "?codigo=" +
          encodeURIComponent(codigo);


        // Consultar Apps Script

        const respuesta =
          await fetch(url);


        // Convertir respuesta a JSON

        const datos =
          await respuesta.json();


        // Producto encontrado

        if (datos.ok) {

          resultado.innerHTML = `

            <div class="producto">

              <div class="nombre">
                ${datos.nombre}
              </div>

              <div class="precio">
                $${datos.precio}
              </div>

            </div>

          `;

        }


        // Producto no encontrado

        else {

          resultado.innerHTML = `

            <div class="mensaje">

              Producto no encontrado.

            </div>

          `;

        }


      } catch (error) {

        console.error(error);


        resultado.innerHTML = `

          <div class="mensaje error">

            No se pudo conectar con el servidor.

            <br><br>

            Revisá tu conexión o intentá nuevamente.

          </div>

        `;

      }

    }

  </script>

</body>
</html>
