<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Consulta de precios</title>


  <style>

    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }


    body {

      margin: 0;

      min-height: 100vh;

      background: #f2f2f2;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 20px;

    }


    .contenedor {

      width: 100%;

      max-width: 430px;

      background: white;

      padding: 30px;

      border-radius: 22px;

      box-shadow:
        0 8px 25px rgba(0,0,0,0.12);

      text-align: center;

    }


    h1 {

      margin-top: 0;

      margin-bottom: 10px;

      color: #222;

    }


    .descripcion {

      color: #666;

      margin-bottom: 25px;

    }


    input {

      width: 100%;

      padding: 15px;

      border: 2px solid #ddd;

      border-radius: 12px;

      font-size: 18px;

      text-align: center;

      outline: none;

    }


    input:focus {

      border-color: #333;

    }


    button {

      width: 100%;

      margin-top: 15px;

      padding: 15px;

      border: none;

      border-radius: 12px;

      background: #222;

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

    }


    button:hover {

      background: #444;

    }


    button:disabled {

      background: #999;

      cursor: not-allowed;

    }


    #estado {

      margin-top: 12px;

      font-size: 13px;

      color: #777;

    }


    #resultado {

      margin-top: 25px;

      display: none;

      padding: 20px;

      background: #f7f7f7;

      border-radius: 15px;

      text-align: left;

    }


    .dato {

      margin-bottom: 15px;

    }


    .dato:last-child {

      margin-bottom: 0;

    }


    .etiqueta {

      display: block;

      color: #777;

      font-size: 14px;

      margin-bottom: 5px;

    }


    .valor {

      font-size: 20px;

      font-weight: bold;

      color: #222;

    }


    .precio {

      font-size: 28px;

    }


    .error {

      color: #c62828 !important;

    }


    .exito {

      color: #2e7d32 !important;

    }

  </style>

</head>


<body>


  <div class="contenedor">


    <h1>
      Consulta de precios
    </h1>


    <p class="descripcion">
      Ingresá el código del producto
    </p>


    <input
      type="number"
      id="codigo"
      placeholder="Ejemplo: 1"
      min="1"
    >


    <button
      id="boton"
      onclick="buscar()"
    >
      BUSCAR
    </button>


    <div id="estado">
      Cargando productos...
    </div>


    <div id="resultado"></div>


  </div>


  <script>


    // ==================================================
    // URL DE GOOGLE APPS SCRIPT
    // ==================================================

    const API =
      "https://script.google.com/macros/s/AKfycbyETNq5FKaJCITOcX3iRTGE_HYMWrAkUgNlBGhV4ddjsJkMAMjlcigoMT39HfwXad46/exec";


    // ==================================================
    // PRODUCTOS EN MEMORIA
    // ==================================================

    let productos = {};

    let productosCargados = false;

    let cargando = false;


    // ==================================================
    // CARGAR TODOS LOS PRODUCTOS
    // ==================================================

    function cargarProductos() {


      if (cargando || productosCargados) {

        return;

      }


      cargando = true;


      const callback =
        "productos_" + Date.now();


      window[callback] =
        function(datos) {


          cargando = false;


          // ------------------------------------------
          // ERROR
          // ------------------------------------------

          if (!datos.ok) {

            mostrarEstado(
              datos.error ||
              "No se pudieron cargar los productos.",
              true
            );

            eliminarScript();

            delete window[callback];

            return;

          }


          // ------------------------------------------
          // GUARDAR PRODUCTOS
          // ------------------------------------------

          if (
            Array.isArray(datos.productos)
          ) {


            datos.productos.forEach(
              function(producto) {


                const codigo =
                  String(
                    producto.codigo
                  ).trim();


                productos[codigo] = {

                  nombre:
                    producto.nombre,

                  precio:
                    producto.precio

                };


              }
            );

          }


          productosCargados = true;


          mostrarEstado(
            "✓ Productos cargados",
            false
          );


          eliminarScript();

          delete window[callback];


        };


      const script =
        document.createElement("script");


      script.id =
        "scriptProductos";


      script.src =
        API +
        "?todos=1" +
        "&callback=" +
        encodeURIComponent(callback);


      script.onerror =
        function() {


          cargando = false;


          mostrarEstado(
            "No se pudo conectar con Google.",
            true
          );


          eliminarScript();

          delete window[callback];


        };


      document.body.appendChild(script);


      // ------------------------------------------
      // TIEMPO MÁXIMO
      // ------------------------------------------

      setTimeout(
        function() {


          if (window[callback]) {


            cargando = false;


            mostrarEstado(
              "Google está tardando demasiado.",
              true
            );


            eliminarScript();

            delete window[callback];


          }


        },
        15000
      );


    }


    // ==================================================
    // BUSCAR PRODUCTO
    // ==================================================

    function buscar() {


      const codigo =
        document
          .getElementById("codigo")
          .value
          .trim();


      const resultado =
        document
          .getElementById("resultado");


      // ------------------------------------------
      // CÓDIGO VACÍO
      // ------------------------------------------

      if (!codigo) {


        resultado.style.display =
          "block";


        resultado.className =
          "error";


        resultado.innerHTML =
          "Ingresá un código de producto.";


        return;

      }


      // ------------------------------------------
      // TODAVÍA CARGANDO
      // ------------------------------------------

      if (!productosCargados) {


        resultado.style.display =
          "block";


        resultado.className =
          "error";


        resultado.innerHTML =
          "Esperá a que se carguen los productos.";


        return;

      }


      // ------------------------------------------
      // BUSCAR EN MEMORIA
      // ------------------------------------------

      const producto =
        productos[codigo];


      // ------------------------------------------
      // NO ENCONTRADO
      // ------------------------------------------

      if (!producto) {


        resultado.style.display =
          "block";


        resultado.className =
          "error";


        resultado.innerHTML =
          "Producto no encontrado.";


        return;

      }


      // ------------------------------------------
      // MOSTRAR RESULTADO
      // ------------------------------------------

      resultado.style.display =
        "block";


      resultado.className = "";


      resultado.innerHTML = `

        <div class="dato">

          <span class="etiqueta">
            Nombre de producto
          </span>

          <span class="valor">
            ${escapeHTML(producto.nombre)}
          </span>

        </div>


        <div class="dato">

          <span class="etiqueta">
            Precio
          </span>

          <span class="valor precio">
            ${formatearPrecio(producto.precio)}
          </span>

        </div>

      `;


    }


    // ==================================================
    // FORMATEAR PRECIO
    // ==================================================

    function formatearPrecio(precio) {


      if (
        precio === null ||
        precio === undefined
      ) {

        return "$0";

      }


      let texto =
        String(precio).trim();


      texto =
        texto.replace(
          /\$/g,
          ""
        ).trim();


      return "$" + texto;


    }


    // ==================================================
    // MOSTRAR ESTADO
    // ==================================================

    function mostrarEstado(
      texto,
      error
    ) {


      const estado =
        document
          .getElementById("estado");


      estado.textContent =
        texto;


      estado.className =
        error
          ? "error"
          : "exito";


    }


    // ==================================================
    // ELIMINAR SCRIPT
    // ==================================================

    function eliminarScript() {


      const script =
        document.getElementById(
          "scriptProductos"
        );


      if (script) {

        script.remove();

      }

    }


    // ==================================================
    // SEGURIDAD
    // ==================================================

    function escapeHTML(texto) {


      return String(texto)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    // ==================================================
    // ENTER PARA BUSCAR
    // ==================================================

    document
      .getElementById("codigo")
      .addEventListener(
        "keydown",
        function(event) {


          if (
            event.key === "Enter"
          ) {

            buscar();

          }


        }
      );


    // ==================================================
    // CARGAR AL ABRIR LA PÁGINA
    // ==================================================

    cargarProductos();


  </script>


</body>

</html>
