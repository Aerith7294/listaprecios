<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Consulta de precios</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .contenedor {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 30px;
      border-radius: 22px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 10px;
      color: #222;
    }

    .descripcion {
      color: #666;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 2px solid #ddd;
      border-radius: 12px;
      font-size: 18px;
      text-align: center;
      outline: none;
    }

    input:focus {
      border-color: #333;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #222;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #resultado {
      margin-top: 25px;
      display: none;
      padding: 20px;
      background: #f7f7f7;
      border-radius: 15px;
      text-align: left;
    }

    .dato {
      margin-bottom: 15px;
    }

    .dato:last-child {
      margin-bottom: 0;
    }

    .etiqueta {
      display: block;
      color: #777;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .valor {
      font-size: 20px;
      font-weight: bold;
      color: #222;
    }

    .precio {
      font-size: 28px;
      color: #111;
    }

    .error {
      color: #c62828;
      background: #ffebee !important;
      text-align: center !important;
    }

    .cargando {
      color: #555;
      text-align: center !important;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>Consulta de precios</h1>

    <p class="descripcion">
      Ingresá el código del producto
    </p>

    <input
      type="number"
      id="codigo"
      placeholder="Ejemplo: 1"
      min="1"
    >

    <button id="boton" onclick="buscar()">
      BUSCAR
    </button>

    <div id="resultado"></div>

  </div>


  <script>

    // ==========================================
    // URL DE TU GOOGLE APPS SCRIPT
    // ==========================================

    const API =
      "https://script.google.com/macros/s/AKfycbyETNq5FKaJCITOcX3iRTGE_HYMWrAkUgNlBGhV4ddjsJkMAMjlcigoMT39HfwXad46/exec";


    // ==========================================
    // BUSCAR PRODUCTO
    // ==========================================

    function buscar() {

      const codigo =
        document.getElementById("codigo").value.trim();

      const resultado =
        document.getElementById("resultado");

      const boton =
        document.getElementById("boton");


      // Verificar que haya código

      if (!codigo) {

        resultado.style.display = "block";

        resultado.className = "error";

        resultado.innerHTML =
          "Ingresá un código de producto.";

        return;
      }


      // Mostrar cargando

      resultado.style.display = "block";

      resultado.className = "cargando";

      resultado.innerHTML =
        "Buscando producto...";

      boton.disabled = true;


      // Crear callback único

      const callback =
        "respuesta_" + Date.now();


      // Función que recibirá la respuesta

      window[callback] = function(datos) {

        boton.disabled = false;


        // Producto encontrado

        if (datos.ok) {

          resultado.className = "";

          resultado.innerHTML = `

            <div class="dato">

              <span class="etiqueta">
                Nombre de producto
              </span>

              <span class="valor">
                ${escapeHTML(datos.nombre)}
              </span>

            </div>


            <div class="dato">

              <span class="etiqueta">
                Precio
              </span>

              <span class="valor precio">
                ${formatearPrecio(datos.precio)}
              </span>

            </div>

          `;

        }

        // Producto no encontrado

        else {

          resultado.className = "error";

          resultado.innerHTML =
            datos.error || "Producto no encontrado.";

        }


        // Eliminar callback

        delete window[callback];

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

      };


      // Crear script JSONP

      const script =
        document.createElement("script");


      script.src =
        API +
        "?codigo=" +
        encodeURIComponent(codigo) +
        "&callback=" +
        encodeURIComponent(callback);


      script.onerror = function() {

        boton.disabled = false;

        resultado.style.display = "block";

        resultado.className = "error";

        resultado.innerHTML =
          "No se pudo conectar con el servidor.";

        delete window[callback];

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

      };


      document.body.appendChild(script);


      // Tiempo máximo de espera

      setTimeout(function() {

        if (window[callback]) {

          boton.disabled = false;

          resultado.className = "error";

          resultado.innerHTML =
            "La búsqueda tardó demasiado. Intentá nuevamente.";

          delete window[callback];

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }

        }

      }, 10000);

    }


    // ==========================================
    // FORMATEAR PRECIO
    // ==========================================

    function formatearPrecio(precio) {

      if (precio === null || precio === undefined) {
        return "$0";
      }

      let texto = String(precio).trim();

      // Si ya tiene $, no agregar otro

      texto = texto.replace(/\$/g, "").trim();

      return "$" + texto;
    }


    // ==========================================
    // EVITAR HTML INYECTADO
    // ==========================================

    function escapeHTML(texto) {

      return String(texto)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    // ==========================================
    // BUSCAR AL PRESIONAR ENTER
    // ==========================================

    document
      .getElementById("codigo")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
          buscar();
        }

      });

  </script>

</body>
</html>
