<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Consulta de precios</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;

      background: #eeeeee;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .contenedor {
      width: 100%;
      max-width: 430px;

      background: white;

      padding: 30px;

      border-radius: 22px;

      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);

      text-align: center;
    }

    h1 {
      margin: 0;

      font-size: 32px;

      font-weight: 700;

      color: #111;
    }

    .descripcion {
      margin-top: 10px;
      margin-bottom: 25px;

      font-size: 17px;

      color: #777;
    }

    input {
      width: 100%;

      padding: 16px;

      font-size: 21px;

      text-align: center;

      border: 2px solid #dddddd;

      border-radius: 12px;

      outline: none;
    }

    input:focus {
      border-color: #222;
    }

    button {
      width: 100%;

      margin-top: 15px;

      padding: 16px;

      border: none;

      border-radius: 12px;

      background: #222;

      color: white;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

      transition: 0.15s;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #resultado {
      margin-top: 25px;
    }

    .producto {
      background: #f6f6f6;

      border-radius: 16px;

      padding: 22px;

      border: 1px solid #eeeeee;
    }

    .etiqueta {
      font-size: 13px;

      font-weight: bold;

      letter-spacing: 1px;

      color: #888;

      text-transform: uppercase;

      margin-bottom: 7px;
    }

    .nombre {
      font-size: 27px;

      font-weight: bold;

      color: #111;

      margin-bottom: 22px;

      word-wrap: break-word;
    }

    .precio {
      font-size: 36px;

      font-weight: 800;

      color: #111;
    }

    .mensaje {
      padding: 15px;

      background: #fff3cd;

      border-radius: 12px;

      color: #664d03;

      font-size: 16px;
    }

    .error {
      padding: 15px;

      background: #f8d7da;

      border-radius: 12px;

      color: #842029;

      font-size: 16px;
    }

    .cargando {
      color: #777;

      font-size: 16px;
    }

    @media (max-width: 480px) {

      .contenedor {
        padding: 25px;
      }

      h1 {
        font-size: 29px;
      }

      .nombre {
        font-size: 25px;
      }

      .precio {
        font-size: 34px;
      }

    }

  </style>

</head>


<body>

  <div class="contenedor">

    <h1>Consulta de precios</h1>

    <div class="descripcion">
      Ingresá el código del producto
    </div>

    <input
      id="codigo"
      type="text"
      inputmode="numeric"
      placeholder="Ejemplo: 1"
      autocomplete="off"
    >

    <button id="boton" onclick="buscar()">
      BUSCAR
    </button>

    <div id="resultado"></div>

  </div>


<script>

  // ==========================================
  // GOOGLE APPS SCRIPT
  // ==========================================

  const API =
    "https://script.google.com/macros/s/AKfycbznruyRgKJptVPcUcVtpsceQ7XWRsKkoetnn8qyQczn0MpCwzFciyj6JDPXniBDVdoW/exec";


  // ==========================================
  // FUNCIÓN PARA BUSCAR
  // ==========================================

  function buscar() {

    const codigo =
      document.getElementById("codigo").value.trim();

    const resultado =
      document.getElementById("resultado");

    const boton =
      document.getElementById("boton");


    // Si no escribió ningún código

    if (codigo === "") {

      resultado.innerHTML = `
        <div class="mensaje">
          Ingresá un código de producto.
        </div>
      `;

      return;
    }


    // Mostrar mensaje de búsqueda

    resultado.innerHTML = `
      <div class="cargando">
        Buscando producto...
      </div>
    `;

    boton.disabled = true;


    // Crear nombre único para el callback

    const callback =
      "respuesta_" + Date.now();


    let terminado = false;


    // ==========================================
    // RESPUESTA DE GOOGLE APPS SCRIPT
    // ==========================================

    window[callback] = function(datos) {

      terminado = true;

      boton.disabled = false;


      // Producto encontrado

      if (datos && datos.ok) {


        // Evita que aparezca $$ si Sheets
        // ya devuelve el precio con $

        const precio =
          "$" +
          String(datos.precio)
            .replace(/\$/g, "")
            .trim();


        resultado.innerHTML = `

          <div class="producto">

            <div class="etiqueta">
              Nombre de producto
            </div>

            <div class="nombre">
              ${datos.nombre}
            </div>

            <div class="etiqueta">
              Precio
            </div>

            <div class="precio">
              ${precio}
            </div>

          </div>

        `;


      }

      // Producto no encontrado

      else {

        resultado.innerHTML = `

          <div class="mensaje">
            Producto no encontrado.
          </div>

        `;

      }


      // Limpiar callback

      delete window[callback];


      if (script) {
        script.remove();
      }

    };


    // ==========================================
    // CREAR SOLICITUD JSONP
    // ==========================================

    const script =
      document.createElement("script");


    script.src =
      API +
      "?codigo=" +
      encodeURIComponent(codigo) +
      "&callback=" +
      callback;


    // ==========================================
    // TIEMPO MÁXIMO DE ESPERA
    // ==========================================

    const tiempoEspera =
      setTimeout(function() {

        if (!terminado) {

          resultado.innerHTML = `

            <div class="error">

              No se pudo obtener la información.

              <br><br>

              Intentá nuevamente.

            </div>

          `;

          boton.disabled = false;

          delete window[callback];

          if (script) {
            script.remove();
          }

        }

      }, 10000);


    // Enviar solicitud

    document.body.appendChild(script);

  }


  // ==========================================
  // ENTER PARA BUSCAR
  // ==========================================

  document
    .getElementById("codigo")
    .addEventListener("keydown", function(event) {

      if (event.key === "Enter") {

        buscar();

      }

    });

</script>

</body>

</html>
